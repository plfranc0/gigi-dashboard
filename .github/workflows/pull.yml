name: pull-stats

on:
  schedule:
    - cron: '7 * * * *'       # hourly TikTok refresh (10 most recent videos)
    - cron: '37 13 1,15 * *'  # TikTok full catalog sweep, 1st + 15th
    - cron: '22 6,18 * * *'   # Instagram profile + posts, 2x/day
  workflow_dispatch:
    inputs:
      mode:
        description: 'hourly, full, or ig'
        required: false
        default: 'hourly'

permissions:
  contents: write

concurrency:
  group: pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide mode
        id: mode
        run: |
          MODE="hourly"
          if [ "${{ github.event.schedule }}" = "37 13 1,15 * *" ]; then MODE="full"; fi
          if [ "${{ github.event.schedule }}" = "22 6,18 * * *" ]; then MODE="ig"; fi
          if [ -n "${{ github.event.inputs.mode }}" ]; then MODE="${{ github.event.inputs.mode }}"; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Pull stats
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: python3 scripts/pull.py

      - name: Commit data
        run: |
          git config user.name "gigi-dashboard-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: ${{ steps.mode.outputs.mode }} pull $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
