name: pull-stats

on:
  schedule:
    - cron: '7 1,15,20 * * *' # TikTok recent-videos refresh 3x/day (~6pm/8am/1pm PT)
    - cron: '37 13 1,15 * *'  # TikTok full catalog sweep, 1st + 15th
    - cron: '22 6,18 * * *'   # Instagram profile + posts, 2x/day
  workflow_dispatch:
    inputs:
      mode:
        description: 'recent, full, or ig'
        required: false
        default: 'recent'

permissions:
  contents: write

concurrency:
  group: pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Decide mode
        id: mode
        run: |
          MODE="recent"
          if [ "${{ github.event.schedule }}" = "37 13 1,15 * *" ]; then MODE="full"; fi
          if [ "${{ github.event.schedule }}" = "22 6,18 * * *" ]; then MODE="ig"; fi
          if [ -n "${{ github.event.inputs.mode }}" ]; then MODE="${{ github.event.inputs.mode }}"; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Pull stats
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: python3 scripts/pull.py

      # Tag any new videos + refresh insights. continue-on-error so an AI-side
      # failure never blocks the stats commit - the step still shows red and
      # the scripts emit ::warning annotations, so failures stay visible.
      - name: AI tags + insights
        if: steps.mode.outputs.mode != 'ig'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/ai-tag.py
          python3 scripts/ai-insights.py

      - name: Commit data
        run: |
          git config user.name "gigi-dashboard-bot"
          git config user.email "actions@github.com"
          git add data/ assets/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: ${{ steps.mode.outputs.mode }} pull $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
